# ============== 视频素材清洗 (cleaner) ==============
# 供随 main.py 启动的 video_clean Worker 使用；一次性 CLI 也复用同一配置。
# 清洗逻辑：扫描 t_busi_content，用 grade 规则对候选视频分级，
# 通过 P1/P2/P3 的写入 t_material_clean（已清洗的素材清单）。
[cleaner]
enabled = true
poll_interval = 3600.0
batch_size = 1000
max_batches_per_platform = 20
ttl_days = 14
watermark_key = "cleaner:grade:watermark"
suspect_seconds = 120.0

# grade.<platform> 下的 p1/p2/p3 为分级规则（按 P1→P2→P3 瀑布判定）。
# 每条规则命中条件：发布时长(小时) <= max_hours 且 播放量 >= min_views。
[grade.tiktok]
[[grade.tiktok.filters]]
field = "extend_data.aigcLabelType"
operator = ">"
value = 0
[[grade.tiktok.p1]]
max_hours = 24.0
min_views = 3000
[[grade.tiktok.p1]]
max_hours = 72.0
min_views = 20000
[[grade.tiktok.p2]]
max_hours = 24.0
min_views = 2500
[[grade.tiktok.p3]]
max_hours = 168.0
min_views = 40000
