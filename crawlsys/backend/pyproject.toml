[project]
name = "crawlstore"
version = "0.1.0"
description = "CrawlStore - 爬虫数据存储和处理器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 核心依赖
    "go-rpc-sdk",
    "loguru>=0.7.0",
    "httpx>=0.25.0",
    "cryptography>=50,<51",
    "python-dotenv>=1.0.0",
    "mmh3>=4.0.0",
    "jsonschema>=4.20",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "pymongo>=4.5.0",
    "motor>=3.3.0",
    "minio>=7.2.0",
    "mcp>=2,<3",
    "yt-dlp>=2025.1.15",
    "elasticsearch>=8.0.0",
    # 数据库驱动 (SQLAlchemy 后端)
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.19.0",
    "pyodbc>=5.0.0",
    "tomli>=1.1.0; python_version<'3.11'",
    # 任务调度
    "croniter>=3.0.0",
    # Windows/macOS 无系统 IANA 时区数据库时 zoneinfo 需要 tzdata
    "tzdata>=2024.1",
    # Parser 模块依赖 (Crawl4AI 迁移)
    "pydantic>=2.0.0",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",
    "rank-bm25>=0.2.0",
    "snowballstemmer>=2.2.0",
    "numpy>=1.24.0",
    # === LangChain / LangGraph 集成 ===
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-litellm>=0.5.1,<0.6",
    # Web 服务依赖
    "fastapi>=0.141,<0.142",
    "starlette>=1.3.1,<1.7",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# Web 服务
web = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.30.0",
]
# 开发/测试
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
# PDF 支持
pdf = ["pypdf>=6.15.0", "pdfplumber>=0.10.0"]
# CSV/Excel 增强
data = ["pandas>=2.0.0"]
# JSON/XML 增强
structured = ["jsonpath-ng>=1.6.0"]
# 全部功能
all = [
    "crawlstore[web,pdf,data,structured]",
]

[tool.uv.sources]
go-rpc-sdk = { path = "../../go-rpc/sdk/python", editable = true }

