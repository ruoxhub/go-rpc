[postgresql]
username = "crawlstore"
password = ""
host = "postgres"
port = 5432
database = "crawlstore"

[redis]
username = ""
password = ""
host = "redis"
port = 6379

[minio]
username = ""
password = ""
host = "host.docker.internal"
port = 9000
secure = false

[scheduler]
worker_id = "scheduler-docker-01"
poll_interval_ms = 1000
default_loop_interval_seconds = 3600
batch_size = 10
zombie_reap_after_seconds = 600
graceful_shutdown_seconds = 30

[scheduler.rpc]
base_url = "http://host.docker.internal:5612"
timeout_seconds = 60

[llm]
format = "openai"
model = "gpt-4o"
api_key = ""
base_url = ""
request_path = "chat"
max_tokens = 8192
temperature = 0.0
enable_thinking = false

[analysis.video]
is_base64 = false
frame_sampling_strategy = "scene_guided"
max_frames = 32
frame_interval_seconds = 5.0
frame_timestamps = []

[web]
host = "0.0.0.0"
port = 8081
mode = "release"
debugger = false

[proxy]
url = ""

[mcp]
enabled = true
allowed_hosts = ["localhost", "localhost:*", "127.0.0.1", "127.0.0.1:*", "backend", "backend:*"]
allowed_origins = []
inline_object_limit_bytes = 10485760
inline_object_hard_limit_bytes = 52428800
presigned_expiry_minutes = 15

[parser_configuration]
sample_bucket = "crawler-parser-samples"
sample_max_response_bytes = 10485760
json_max_depth = 64
json_max_nodes = 100000
ai_max_bytes = 262144
ai_max_array_items = 20
sample_global_limit_per_minute = 30
sample_action_limit_per_minute = 5
assist_global_limit_per_minute = 10
assist_action_limit_per_minute = 2
assist_receipt_ttl_seconds = 900
preview_max_records = 20
preview_max_errors = 200
object_sse_enabled = false

[cleaner]
enabled = true
poll_interval = 3600.0
batch_size = 1000
max_batches_per_platform = 20
ttl_days = 14
watermark_key = "cleaner:grade:watermark"
suspect_seconds = 120.0

[grade.tiktok]
[[grade.tiktok.filters]]
field = "extend_data.aigcLabelType"
operator = ">"
value = 0
[[grade.tiktok.p1]]
max_hours = 24.0
min_views = 3000
[[grade.tiktok.p1]]
max_hours = 72.0
min_views = 20000
[[grade.tiktok.p2]]
max_hours = 24.0
min_views = 2500
[[grade.tiktok.p3]]
max_hours = 168.0
min_views = 40000
