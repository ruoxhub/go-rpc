name: go-rpc-local-db

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sekiro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - go-rpc-local-postgres:/var/lib/postgresql/data
      - ./migration.sql:/docker-entrypoint-initdb.d/001-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sekiro"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  go-rpc-local-postgres:
