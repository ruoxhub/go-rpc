apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "cn.iinti.sekiro.demoapp"
        minSdkVersion 19
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 26
        versionCode 1
        versionName "1.0"

    }

    signingConfigs {
        release {
            storeFile rootProject.file('script/hermes_key')
            storePassword "hermes"
            keyAlias "hermes"
            keyPassword "hermes"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.java {
            // Keep the unpacked legacy Netty SDK as reference only. The demo uses
            // the WebSocket implementation in RpcClient and interfaze/Rpc*.
            exclude 'cn/iinti/sekiro3/business/api/ClusterSekiroClient.java'
            exclude 'cn/iinti/sekiro3/business/api/SekiroClient.java'
            exclude 'cn/iinti/sekiro3/business/api/SekiroInvoker.java'
            exclude 'cn/iinti/sekiro3/business/api/core/**'
            exclude 'cn/iinti/sekiro3/business/api/invoker/**'
            exclude 'cn/iinti/sekiro3/business/api/log/**'
            exclude 'cn/iinti/sekiro3/business/api/protocol/**'
            exclude 'cn/iinti/sekiro3/business/api/util/**'
            exclude 'cn/iinti/sekiro3/business/api/interfaze/CommonRes.java'
            exclude 'cn/iinti/sekiro3/business/api/interfaze/Compressor.java'
            exclude 'cn/iinti/sekiro3/business/api/interfaze/SekiroRequest.java'
            exclude 'cn/iinti/sekiro3/business/api/interfaze/SekiroRequestInitializer.java'
            exclude 'cn/iinti/sekiro3/business/api/interfaze/SekiroResponse.java'
        }
    }


    //在apk文件后边生成版本号信息
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "sekiro-demo${defaultConfig.versionName}_${releaseTime()}.apk"
        }
    }
}

static def releaseTime() {
    return new Date().format("yyyyMMddhhmm", TimeZone.getTimeZone("UTC"))
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'


    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'io.github.mrh30000:go-rpc-sdk:0.1.0-experimental.1'
    implementation 'com.alibaba:fastjson:1.2.83'
    testImplementation 'junit:junit:4.13.2'

}


