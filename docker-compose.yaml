services:
  rpc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpc-server
    restart: unless-stopped
    ports:
      - "${RPC_PORT:-5612}:5612"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5612/business/groupList || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

